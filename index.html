<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="Stream: a data processing language for ciphers and puzzles, running in your browser.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<title>Stream</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b5bdb'/%3E%3Cpath d='M10 9l8 7-8 7' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>

<svg hidden>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C10 5 7.5 4.5 4 4.5v13c3.5 0 6 .5 8 2 2-1.5 4.5-2 8-2v-13c-3.5 0-6 .5-8 2zM12 6.5v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-clear" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="bar">
  <h1 class="brand"><span class="brand-mark" aria-hidden="true">&rsaquo;</span>Stream</h1>
  <div class="bar-actions">
    <button type="button" class="btn" id="help-open" title="Reference">
      <svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><span>Reference</span>
    </button>
    <button type="button" class="btn" id="clear" aria-label="Clear and start a new session" title="Clear and start a new session">
      <svg class="icon" aria-hidden="true"><use href="#i-clear"/></svg><span class="wide-only">Clear</span>
    </button>
  </div>
</header>

<div class="workspace" id="workspace">
  <main class="session">
    <div class="scroller" id="scroller">
      <section class="welcome" id="welcome" aria-labelledby="welcome-title">
        <h2 id="welcome-title">New session</h2>
        <p>Type an expression below, or try one of these:</p>
        <ul class="samples" id="samples">
          <li><button type="button" class="sample" data-run='(1..25):{"Wkh txlfn eurzq ira" - #}'><code>(1..25):{"Wkh txlfn eurzq ira" - #}</code><span>Try every Caesar shift</span></button></li>
          <li><button type="button" class="sample" data-run='"Mississippi".lcase.counts'><code>"Mississippi".lcase.counts</code><span>Count the letters</span></button></li>
          <li><button type="button" class="sample" data-run='"48 65 6c 6c 6f".split(iswhite):strnum(16):unichr.string'><code>"48 65 6c 6c 6f".split(iswhite):strnum(16):unichr.string</code><span>Decode hex bytes</span></button></li>
          <li><button type="button" class="sample" data-run='"Every good boy does fine".split(iswhite):first.string'><code>"Every good boy does fine".split(iswhite):first.string</code><span>Read the first letters</span></button></li>
          <li><button type="button" class="sample" data-run='(2^64-1).factor'><code>(2^64-1).factor</code><span>Prime factors</span></button></li>
          <li><button type="button" class="sample" data-run='primes.windows(2).select{#[2]-#[1]==2}'><code>primes.windows(2).select{#[2]-#[1]==2}</code><span>Twin primes</span></button></li>
        </ul>
      </section>
      <div class="alert" id="fatal" role="alert" hidden></div>
      <ol class="log" id="log" role="log" aria-label="Session transcript"></ol>
    </div>

    <form class="composer" id="composer">
      <div class="keys" id="keys" role="group" aria-label="Insert a symbol"></div>
      <div class="field" id="field">
        <span class="prompt" aria-hidden="true">&rsaquo;</span>
        <div class="editor">
          <div id="edit-mirror" aria-hidden="true" data-placeholder="Type an expression, or ? for help"></div>
          <div id="edit-real" contenteditable="plaintext-only" role="textbox" aria-multiline="true"
               aria-label="Stream expression" aria-describedby="status"
               spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="go"></div>
        </div>
        <button type="submit" class="run" id="run" aria-label="Run" title="Run (Enter)">
          <svg class="icon" aria-hidden="true"><use id="run-icon" href="#i-play"/></svg>
        </button>
      </div>
      <div class="under">
        <p class="status" id="status" role="status"></p>
        <p class="hint" id="hint"><span><kbd>Enter</kbd> run</span><span><kbd>Shift</kbd>+<kbd>Enter</kbd> new line</span><span><kbd>&uarr;</kbd> previous input</span><span><kbd>Esc</kbd> stop</span></p>
      </div>
    </form>
  </main>

  <dialog class="pager" id="pager" aria-labelledby="pager-title">
    <header class="pager-head">
      <button type="button" class="btn icon-only" id="pager-back" aria-label="Back to the previous page" title="Back" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
      </button>
      <div class="pager-titles">
        <h2 id="pager-title"></h2>
        <p class="pager-source" id="pager-source"></p>
      </div>
      <button type="button" class="btn icon-only" id="pager-close" aria-label="Close" title="Close">
        <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </header>
    <div class="pager-body" id="pager-body" tabindex="0" autofocus aria-label="Stream items">
      <ol class="items" id="pager-list"></ol>
      <div id="pager-sentinel" aria-hidden="true"></div>
      <article class="help" id="help-page" hidden></article>
    </div>
    <footer class="pager-foot" id="pager-foot">
      <p id="pager-status" role="status"></p>
      <button type="button" class="btn" id="pager-stop" hidden>Stop</button>
    </footer>
  </dialog>
</div>

<script type="module" src="main.js?v=4"></script>

</body>
</html>
